version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: securebank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking}
      POSTGRES_USER: ${POSTGRES_USER:-banking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_user} -d ${POSTGRES_DB:-banking}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: securebank-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  kafka:
    image: docker.io/apache/kafka:3.9.0
    container_name: securebank-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: securebank-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/banking
      KC_DB_USERNAME: ${POSTGRES_USER:-banking_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me_keycloak}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8088:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/banking-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.gateway
    image: localhost/banking-gateway:1.0.0
    container_name: securebank-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth:8081
      USER_SERVICE_URL: http://user:8082
      ACCOUNT_SERVICE_URL: http://account:8083
      TRANSACTION_SERVICE_URL: http://transaction:8084
      PAYMENT_SERVICE_URL: http://payment:8085
      NOTIFICATION_SERVICE_URL: http://notification:8086
      AUDIT_SERVICE_URL: http://audit:8087
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8089
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - user
      - account
      - transaction
      - payment
      - notification
      - audit

  auth:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.auth
    image: localhost/banking-auth:1.0.0
    container_name: securebank-auth
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: ${POSTGRES_USER:-banking_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_random_secret_at_least_32_characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    depends_on:
      postgres:
        condition: service_healthy

  user:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.user
    image: localhost/banking-user:1.0.0
    container_name: securebank-user
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: ${POSTGRES_USER:-banking_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    depends_on:
      postgres:
        condition: service_healthy

  account:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.account
    image: localhost/banking-account:1.0.0
    container_name: securebank-account
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: ${POSTGRES_USER:-banking_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    depends_on:
      postgres:
        condition: service_healthy

  transaction:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.transaction
    image: localhost/banking-transaction:1.0.0
    container_name: securebank-transaction
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: ${POSTGRES_USER:-banking_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payment:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.payment
    image: localhost/banking-payment:1.0.0
    container_name: securebank-payment
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: ${POSTGRES_USER:-banking_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.notification
    image: localhost/banking-notification:1.0.0
    container_name: securebank-notification
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started

  audit:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.audit
    image: localhost/banking-audit:1.0.0
    container_name: securebank-audit
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: ${POSTGRES_USER:-banking_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: localhost/banking-frontend:1.0.0
    container_name: securebank-frontend
    restart: unless-stopped
    ports:
      - "8089:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
