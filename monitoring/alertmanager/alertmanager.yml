global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - cluster
    - service

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  receiver: default-receiver

  routes:
    - matchers:
        - severity="critical"
      receiver: critical-receiver
      continue: false

    - matchers:
        - severity="warning"
      receiver: warning-receiver
      continue: false

receivers:

  - name: default-receiver

  - name: warning-receiver

  - name: critical-receiver

inhibit_rules:

  - source_matchers:
      - severity="critical"

    target_matchers:
      - severity="warning"

    equal:
      - alertname
      - namespace
      - service