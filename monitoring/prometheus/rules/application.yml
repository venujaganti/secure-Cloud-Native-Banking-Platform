groups:

  - name: banking-application-rules
    interval: 30s

    rules:

      - record: banking:http_requests:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count[5m]))
          by (job, method, status)

      - record: banking:http_errors:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          by (job, status)

      - record: banking:http_latency:p95
        expr: |
          histogram_quantile(
            0.95,
            sum(
              rate(http_server_requests_seconds_bucket[5m])
            ) by (job, le)
          )

      - record: banking:jvm_heap:usage_ratio
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
          by (job)
          /
          sum(jvm_memory_max_bytes{area="heap"})
          by (job)

      - record: banking:active_requests
        expr: |
          sum(http_server_requests_active)
          by (job)