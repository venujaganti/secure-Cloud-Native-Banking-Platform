apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
  namespace: banking
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

  DB_HOST: "postgres"
  DB_URL: "jdbc:postgresql://postgres:5432/banking"
  DB_PORT: "5432"
  DB_NAME: "banking"

  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/banking"

  AUTH_SERVICE_URL: "http://auth-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  ACCOUNT_SERVICE_URL: "http://account-service:8083"
  TRANSACTION_SERVICE_URL: "http://transaction-service:8084"
  PAYMENT_SERVICE_URL: "http://payment-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  AUDIT_SERVICE_URL: "http://audit-service:8087"

  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/banking"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  SERVER_FORWARD_HEADERS_STRATEGY: "framework"

  TZ: "UTC"