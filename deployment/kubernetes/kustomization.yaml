apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking

resources:
  - namespace/namespace.yaml

  - config/configmap.yaml
  - config/secret.yaml

  - gateway/deployment.yaml
  - gateway/service.yaml

  - auth/deployment.yaml
  - auth/service.yaml

  - user/deployment.yaml
  - user/service.yaml

  - account/deployment.yaml
  - account/service.yaml

  - transaction/deployment.yaml
  - transaction/service.yaml

  - payment/deployment.yaml
  - payment/service.yaml

  - notification/deployment.yaml
  - notification/service.yaml

  - audit/deployment.yaml
  - audit/service.yaml

  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml

  - redis/deployment.yaml
  - redis/service.yaml

  - kafka/deployment.yaml
  - kafka/service.yaml

  - keycloak/deployment.yaml
  - keycloak/service.yaml

  - ingress/ingress.yaml

  - network-policies/default-deny.yaml
  - network-policies/gateway-policy.yaml
  - network-policies/auth-policy.yaml
  - network-policies/database-policy.yaml
  - network-policies/kafka-policy.yaml

  - rbac/service-accounts.yaml
  - rbac/roles.yaml
  - rbac/role-bindings.yaml

  - security/pod-security.yaml
  - security/security-context.yaml
  - security/resource-limits.yaml

commonLabels:
  app.kubernetes.io/part-of: secure-cloud-native-banking-platform
  app.kubernetes.io/managed-by: kustomize

images:
  - name: banking/gateway
    newName: banking/gateway
    newTag: "1.0.0"
  - name: banking/auth
    newName: banking/auth
    newTag: "1.0.0"
  - name: banking/user
    newName: banking/user
    newTag: "1.0.0"
  - name: banking/account
    newName: banking/account
    newTag: "1.0.0"
  - name: banking/transaction
    newName: banking/transaction
    newTag: "1.0.0"
  - name: banking/payment
    newName: banking/payment
    newTag: "1.0.0"
  - name: banking/notification
    newName: banking/notification
    newTag: "1.0.0"
  - name: banking/audit
    newName: banking/audit
    newTag: "1.0.0"