apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-read-only
  namespace: banking
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-secret-reader
  namespace: banking
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-read-only-binding
  namespace: banking
subjects:
  - kind: ServiceAccount
    name: banking-service-account
    namespace: banking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-read-only

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-secret-reader-binding
  namespace: banking
subjects:
  - kind: ServiceAccount
    name: banking-service-account
    namespace: banking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-secret-reader