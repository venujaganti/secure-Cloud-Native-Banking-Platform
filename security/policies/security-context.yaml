apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-security-context
  namespace: banking
data:
  security-context.yaml: |
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault