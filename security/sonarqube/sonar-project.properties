sonar.projectKey=secure-cloud-native-banking-platform
sonar.projectName=Secure Cloud-Native Banking Platform
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,services
sonar.tests=services

sonar.exclusions=\
**/node_modules/**,\
**/target/**,\
**/build/**,\
**/dist/**,\
**/coverage/**,\
**/reports/**,\
**/*.min.js

sonar.test.inclusions=\
**/src/test/**,\
**/*.test.js,\
**/*.test.jsx,\
**/*.spec.js,\
**/*.spec.jsx

sonar.java.binaries=services/*/target/classes
sonar.java.test.binaries=services/*/target/test-classes

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.coverage.exclusions=\
**/config/**,\
**/dto/**,\
**/model/**,\
**/Application.java

sonar.scm.provider=git